name: Runner capacity investigation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

jobs:
  macos:
    name: macOS / ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fbb8060ccd28c213cafe22b61928354aff49e24f
      - name: Record host and toolchain
        run: |
          git rev-parse HEAD
          sw_vers
          xcodebuild -version
          swift --version
          sysctl hw.ncpu hw.memsize
          df -h .
      - name: Exact full macOS profile
        run: |
          mkdir -p "$RUNNER_TEMP/graphevo-capacity"
          (
            while true; do
              date -u
              sysctl vm.swapusage
              top -l 2 -s 1 -n 0 | grep -E '^(CPU usage|PhysMem|VM:)'
              sleep 10
            done
          ) > "$RUNNER_TEMP/graphevo-capacity/resources.log" 2>&1 &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          set -o pipefail
          python3 Scripts/run_ci_tests.py --platform macos --profile full 2>&1 | tee "$RUNNER_TEMP/graphevo-capacity/full.log"
      - name: Same ARM image with serial v2 execution
        if: always() && matrix.runner == 'macos-15'
        run: |
          mkdir -p "$RUNNER_TEMP/graphevo-capacity"
          set -o pipefail
          swift test --skip-build --no-parallel --filter 'GraphEvo(Store|Runtime|Model)Tests' 2>&1 | tee "$RUNNER_TEMP/graphevo-capacity/serial-v2.log"
      - name: Retain text only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capacity-${{ matrix.runner }}
          path: ${{ runner.temp }}/graphevo-capacity
          retention-days: 1
          if-no-files-found: ignore

  ios:
    name: iOS 18.5 / serial test workers
    runs-on: macos-15
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fbb8060ccd28c213cafe22b61928354aff49e24f
      - name: Record host and toolchain
        run: |
          git rev-parse HEAD
          sw_vers
          xcodebuild -version
          swift --version
          sysctl hw.ncpu hw.memsize
          df -h .
      - name: Prepare iOS 18.5 simulator
        run: |
          sudo xcode-select --switch "$DEVELOPER_DIR"
          sudo xcodebuild -runFirstLaunch
          for attempt in 1 2 3; do
            if xcrun simctl list runtimes --json > "$RUNNER_TEMP/graphevo-runtimes.json"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 3
          done
          if ! python3 -c 'import json,sys; r=json.load(open(sys.argv[1]))["runtimes"]; sys.exit(not any(x["identifier"] == "com.apple.CoreSimulator.SimRuntime.iOS-18-5" and x.get("isAvailable") for x in r))' "$RUNNER_TEMP/graphevo-runtimes.json"; then
            xcodebuild -downloadPlatform iOS -buildVersion 18.5
          fi
          GRAPHEVO_SIMULATOR_ID="$(xcrun simctl create 'GraphEvo CI' com.apple.CoreSimulator.SimDeviceType.iPhone-16 com.apple.CoreSimulator.SimRuntime.iOS-18-5)"
          xcrun simctl boot "$GRAPHEVO_SIMULATOR_ID"
          # Xcode waits for readiness; boot proceeds while compilation starts.
          echo "GRAPHEVO_SIMULATOR_ID=$GRAPHEVO_SIMULATOR_ID" >> "$GITHUB_ENV"

      - name: Full iOS suite with parallel testing disabled
        run: |
          mkdir -p "$RUNNER_TEMP/graphevo-capacity"
          set -o pipefail
          xcodebuild -quiet test -scheme GraphEvo -destination "platform=iOS Simulator,id=$GRAPHEVO_SIMULATOR_ID" \
            -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/graphevo-capacity-ios.xcresult" CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/graphevo-capacity/full-serial.log"
      - name: Record iOS result
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/graphevo-capacity-ios.xcresult" ]; then
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/graphevo-capacity-ios.xcresult" \
              | tee "$RUNNER_TEMP/graphevo-capacity/ios-summary.json"
          fi
      - name: Retain text only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capacity-ios-serial
          path: ${{ runner.temp }}/graphevo-capacity
          retention-days: 1
          if-no-files-found: ignore
