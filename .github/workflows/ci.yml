name: CI timeout investigation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

jobs:
  compare:
    runs-on: macos-15
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain and baseline build
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          sysctl hw.ncpu hw.memsize
          git rev-parse HEAD
          swift build --build-tests
      - name: Isolate automatic synchronization test scheduling
        run: |
          mkdir -p "$RUNNER_TEMP/graphevo-177"
          python3 - <<'PY'
          import os
          import pathlib
          import signal
          import subprocess
          import time

          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'graphevo-177'

          def test(name, args, sample=False):
              path = out / (name + '.log')
              start = time.monotonic()
              with path.open('w') as log:
                  task = subprocess.Popen(['swift', 'test', '--skip-build', *args],
                                          stdout=log, stderr=subprocess.STDOUT,
                                          start_new_session=True)
                  try:
                      if sample:
                          for offset in (6, 13):
                              if task.poll() is not None:
                                  break
                              time.sleep(max(0, start + offset - time.monotonic()))
                              matching = subprocess.run(['pgrep', '-f', r'/GraphEvoPackageTests\.xctest/Contents/MacOS/GraphEvoPackageTests'], text=True, capture_output=True)
                              pids = matching.stdout.split()
                              if len(pids) == 1:
                                  with (out / f'{name}-sample-{offset}.log').open('w') as report:
                                      subprocess.run(['sample', pids[0], '1', '10'], stdout=report, stderr=subprocess.STDOUT, timeout=8, check=False)
                      result = task.wait(timeout=max(1, 175 - (time.monotonic() - start)))
                  except subprocess.TimeoutExpired:
                      os.killpg(task.pid, signal.SIGTERM)
                      task.wait(timeout=10)
                      result = 'watchdog'
              print(f'{name}: exit={result} duration={time.monotonic() - start:.2f}s', flush=True)
              for line in path.read_text(errors='replace').splitlines():
                  if 'Test run with' in line or 'recorded an issue' in line or 'Wait expired' in line:
                      print(line, flush=True)

          automatic = ['--filter', 'GraphAutomaticIntegrationTests']
          test('automatic-parallel', automatic, sample=True)
          test('automatic-serial', [*automatic, '--no-parallel'])
          path = pathlib.Path('Tests/GraphEvoStoreTests/GraphAutomaticIntegrationTests.swift')
          original = path.read_text()
          before = '            await Task.yield()'
          assert original.count(before) == 1
          path.write_text(original.replace(before, '            try await Task.sleep(for: .milliseconds(10))'))
          with (out / 'paced-build.log').open('w') as build:
              subprocess.run(['swift', 'build', '--build-tests'], stdout=build, stderr=subprocess.STDOUT, check=True)
          test('automatic-paced-parallel', automatic, sample=True)
          PY
      - name: Retain diagnostic text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphevo-177-timeout-investigation
          path: ${{ runner.temp }}/graphevo-177
          if-no-files-found: ignore
          retention-days: 1
