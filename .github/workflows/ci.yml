name: CI

on:
  pull_request:
    branches:
      - develop
      - master
      - codex/graphevo-2
      - "codex/v2-*"
      - "release/**"
  push:
    branches:
      - develop
      - master
      - codex/graphevo-2
      - "release/**"

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/codex/graphevo-2' }}

jobs:
  test:
    name: Swift package validation
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Validate package manifest
        run: swift package dump-package

      - name: Resolve dependencies
        run: xcodebuild -resolvePackageDependencies -scheme GraphEvo

      - name: Prepare iOS 18.5 simulator
        run: |
          sudo xcode-select --switch "$DEVELOPER_DIR"
          sudo xcodebuild -runFirstLaunch
          for attempt in 1 2 3; do
            if xcrun simctl list runtimes --json > "$RUNNER_TEMP/graphevo-runtimes.json"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 3
          done
          if ! python3 -c 'import json,sys; r=json.load(open(sys.argv[1]))["runtimes"]; sys.exit(not any(x["identifier"] == "com.apple.CoreSimulator.SimRuntime.iOS-18-5" and x.get("isAvailable") for x in r))' "$RUNNER_TEMP/graphevo-runtimes.json"; then
            xcodebuild -downloadPlatform iOS -buildVersion 18.5
          fi
          GRAPHEVO_SIMULATOR_ID="$(xcrun simctl create 'GraphEvo CI' com.apple.CoreSimulator.SimDeviceType.iPhone-16 com.apple.CoreSimulator.SimRuntime.iOS-18-5)"
          xcrun simctl boot "$GRAPHEVO_SIMULATOR_ID"
          xcrun simctl bootstatus "$GRAPHEVO_SIMULATOR_ID" -b
          echo "GRAPHEVO_SIMULATOR_ID=$GRAPHEVO_SIMULATOR_ID" >> "$GITHUB_ENV"

      - name: Build and run tests on iOS Simulator
        run: >-
          xcodebuild test
          -scheme GraphEvo
          -destination 'platform=iOS Simulator,id=${{ env.GRAPHEVO_SIMULATOR_ID }}'
          CODE_SIGNING_ALLOWED=NO

      - name: Check diff formatting
        run: git diff --check

  macos:
    name: Swift package validation (macOS)
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Validate package manifest
        run: swift package dump-package

      - name: Resolve dependencies
        run: xcodebuild -resolvePackageDependencies -scheme GraphEvo

      - name: Build and run tests on macOS
        run: >-
          xcodebuild test
          -scheme GraphEvo
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO

      - name: Check diff formatting
        run: git diff --check
      - name: Run Swift 6 model consumer
        run: swift run --package-path IntegrationTests/PackageConsumer ModelConsumer

      - name: Validate consolidation harness (functional smoke only)
        run: |
          swift build -c release --package-path Experiments/ConsolidationCosts
          GRAPHEVO_COST_BIN="$(swift build -c release --package-path Experiments/ConsolidationCosts --show-bin-path)"
          python3 Experiments/ConsolidationCosts/run.py \
            --executable "$GRAPHEVO_COST_BIN/CostProbe" \
            --output "$RUNNER_TEMP/graphevo-c01-smoke" \
            --cases small --repetitions 1

  package-consumer:
    name: Package consumer integration fixture
    if: >-
      github.ref == 'refs/heads/master' ||
      (github.event_name == 'pull_request' && github.base_ref == 'master')
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          sw_vers
          swift --version

      - name: Run package consumer fixture
        run: swift run --package-path IntegrationTests/PackageConsumer PackageConsumer

      - name: Check diff formatting
        run: git diff --check
