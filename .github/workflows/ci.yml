name: CI

on:
  pull_request:
    branches:
      - develop
      - master
      - "release/**"
  push:
    branches:
      - develop
      - master
      - "release/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' }}

jobs:
  test:
    name: Swift package validation
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Validate package manifest
        run: swift package dump-package

      - name: Resolve dependencies
        run: xcodebuild -resolvePackageDependencies -scheme GraphEvo

      - name: Build and run tests on iOS Simulator
        run: >-
          xcodebuild test
          -scheme GraphEvo
          -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest'
          CODE_SIGNING_ALLOWED=NO

      - name: Check diff formatting
        run: git diff --check

  macos:
    name: Swift package validation (macOS)
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Validate package manifest
        run: swift package dump-package

      - name: Resolve dependencies
        run: xcodebuild -resolvePackageDependencies -scheme GraphEvo

      - name: Build and run tests on macOS
        run: >-
          xcodebuild test
          -scheme GraphEvo
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO

      - name: Check diff formatting
        run: git diff --check
